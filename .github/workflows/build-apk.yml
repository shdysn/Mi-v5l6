name: Build and Release Android App

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  pull-requests: write
  statuses: write

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Ensure Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK and AAB Bundle
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Collect Release Binaries
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk build-artifacts/CentExplorer-v1.0.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab build-artifacts/CentExplorer-v1.0.0-release.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CentExplorer-Production-Artifacts
          path: build-artifacts/*
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cent File Manager Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-artifacts/CentExplorer-v1.0.0-release.apk
            build-artifacts/CentExplorer-v1.0.0-release.aab
